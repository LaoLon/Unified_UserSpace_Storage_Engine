; HFS fio random read/write benchmark (shard-21).
; Mixed rw job: writes and reads share one file, so reads never hit
; an empty file (the malloc bdev is process-private per fio run).
[global]
ioengine=psync
direct=1
bs=4k
size=64m
iodepth=32

group_reporting=1
time_based=1
runtime=10

[randrw]
rw=randrw
rwmixread=50
filename=/hfs/fio/rw.dat
