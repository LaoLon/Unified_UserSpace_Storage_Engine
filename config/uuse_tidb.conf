[uuse]
schema_version = 1
instance_name = uuse-tidb
volume_uuid = auto
process_lock = exclusive
# Dedicated lock path so a TiKV node never collides with MySQL (/tmp/uuse.lock)
# or a 3FS storage target on the same host.
process_lock_path = /tmp/uuse-tidb.lock

[spdk]
env_driver = uio
hugepages = 1024

[storage]
metadata_devices = nvme0
data_devices = nvme0
placement = capacity_weighted
metadata_replication = 1
require_all_devices = true
metadata_block_size = 4096
journal_mb = 256
checkpoint_mb = 512
extent_mb = 1
prealloc_extents = 64
max_extents_per_file = 65536

[device.nvme0]
bdev_name = Nvme0n1
# Verify with sysfs topology before use; never infer from the kernel nvmeXn1
# name. 0000:13:00.0 is VMware NVME_0002 on the current lab client VMs.
pci_bdf = 0000:13:00.0
role = metadata,data
weight = 1
required = true

[runtime]
# CPU lists must fit the VM's vCPU count (nproc) and the TiKV test cpuset.
# metadata=0, data reactor=1, frontend=3 leaves CPU 2 for TiKV's own threads
# on a 4-vCPU node; adjust with nproc when cloning a larger VM.
metadata_cpus = 0
data_reactors = 1
max_data_reactors = 4
data_cpus = 1
frontend_cpus = 3
ring_depth = 1024
client_depth = 32

[numa]
policy = local-first
device_numa = auto
dma_numa = auto
frontend_numa = device-local
allow_remote_dma = false
remote_fallback = bounded
polling = hybrid

[limits]
# TiKV engine files go through the FileSystem seam; 256 MiB covers in-flight
# bounce plus per-thread client buffers on the 3.3 GiB lab VM. Re-check the
# budget in Shard-113 once TiKV block cache/memtable are pinned.
dma_arena_mb = 256
operation_pool = 4096
coroutine_frame_pool = 4096
metadata_wait_timeout_ms = 5000
backend_retry_limit = 3

[metadata]
max_inodes = 1000000
max_namespace_bytes = 1073741824
checkpoint_trigger_percent = 50
checkpoint_force_percent = 80
# Coalescing window; 0 removes the per-commit sleep. Every barrier is already
# durable, so waiting only adds latency; revisit in Shard-120 if TiKV commit
# latency shows a batching win.
max_group_commit_wait_us = 0

[observability]
trace = false
trace_sample = 1
trace_dir = /home/uuse
stats = false
