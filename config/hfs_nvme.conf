[hfs]
schema_version = 1
instance_name = hfs2
volume_uuid = auto
process_lock = exclusive
process_lock_path = /tmp/hfs2.lock

[spdk]
env_driver = uio
hugepages = 1024

[storage]
metadata_devices = nvme0
data_devices = nvme0
placement = capacity_weighted
metadata_replication = 1
require_all_devices = true
metadata_block_size = 4096
journal_mb = 256
checkpoint_mb = 512
extent_mb = 1
prealloc_extents = 64
max_extents_per_file = 65536

[device.nvme0]
bdev_name = Nvme0n1
pci_bdf = 0000:13:00.0
role = metadata,data
weight = 1
required = true

[runtime]
metadata_cpus = 0
data_reactors = 1
max_data_reactors = 4
data_cpus = 1
frontend_cpus = 3
ring_depth = 1024
client_depth = 32

[rocksdb]
worker_direct_reads = true

[numa]
policy = local-first
device_numa = auto
dma_numa = auto
frontend_numa = device-local
allow_remote_dma = false
remote_fallback = bounded
polling = hybrid

[limits]
dma_arena_mb = 512
operation_pool = 4096
coroutine_frame_pool = 4096
metadata_wait_timeout_ms = 5000
backend_retry_limit = 3

[metadata]
max_inodes = 1000000
max_namespace_bytes = 1073741824
checkpoint_trigger_percent = 50
checkpoint_force_percent = 80
max_group_commit_wait_us = 200

[observability]
trace = false
trace_sample = 1
trace_dir = /mnt/hfs-data
stats = false
